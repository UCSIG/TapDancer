name: tapdancer
description: A simple footswitch to turn pages on devices displaying musical sheet notation.
version: 1.2.1
publish_to: "none"

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0 # State management
  universal_ble: ^3.4.1 # BLE communication
  window_manager: ^0.7.1 # Window management
  shared_preferences: ^2.5.6 # Persistent key value storage
  logger: ^2.8.0 # Logging
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.2 # App version info (must share a win32 major with file_picker)
  nordic_dfu: ^8.1.0 # Over-the-air firmware updates (Android/iOS/macOS only)
  file_picker: ^13.4.1 # Export/import configuration files (open + save dialogs)
  path_provider: ^2.1.4 # App-data directory for automatic config backups
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

# Patched universal_ble (Windows HID AccessDenied fix) until upstream fixes it;
# see third_party/universal_ble/TAPDANCER_PATCH.md.
dependency_overrides:
  universal_ble:
    path: third_party/universal_ble

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.4"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/tapdancer_icon.png
    # Bundled DFU package + version manifest, synced from ../firmware/release
    # via scripts/sync_firmware.ps1
    - assets/firmware/firmware_tapdancer.zip
    - assets/firmware/version.json

# dart run flutter_launcher_icons
flutter_launcher_icons:
  # android: true
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/tapdancer_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/tapdancer_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/tapdancer_icon.png"
