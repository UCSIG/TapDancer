; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = xiaoble_adafruit

[env]
framework = arduino

[env:xiaoble_adafruit]
# Currently @cac6fcf943a41accd2aeb4f3659ae297a73f422e.
#
# Change to official https://github.com/platformio/platform-nordicnrf52/pull/151 once pull request is merged.
# This uses this pio package https://github.com/maxgerhardt/framework-arduinoadafruitnrf52-seeed
# however, the last bootloader version is 0.6.2, the most recent adafruit bootlader is 0.9.2,
# and it fixes a ble ota issue.
#
# Bootloader:
# https://github.com/adafruit/Adafruit_nRF52_Bootloader/releases
#
# Shipped bootloader:
# UF2 Bootloader 0.6.1 lib/nrfx (v2.0.0) lib/tinyusb (0.10.1-293-gaf8e5a90) lib/uf2 (remotes/origin/configupdate-9-gadbb8c7)
# Model: Seeed XIAO nRF52840
# Board-ID: Seeed_XIAO_nRF52840_Sense
# SoftDevice: S140 version 7.3.0
# Date: Nov 12 2021
#
# Updated bootloader:
# UF2 Bootloader 0.9.2 lib/nrfx (v2.0.0) lib/tinyusb (0.12.0-145-g9775e7691) lib/uf2 (remotes/origin/configupdate-9-gadbb8c7)
# Model: Seeed XIAO nRF52840
# Board-ID: nRF52840-SeeedXiao-v1
# Date: Jul 19 2024
# SoftDevice: S140 7.3.0
#
# Upload custom bootloader:
# https://community.platformio.org/t/upload-custom-bootloader-to-feather-nrf52832-boards-through-jlink/22727/2
# https://github.com/platformio/platform-nordicnrf52/issues/120
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoble_adafruit
; platform = https://github.com/Seeed-Studio/platform-seeedboards.git
; board = seeed-xiao-afruitnrf52-nrf52840
monitor_speed = 115200
monitor_dtr = 1
lib_deps = 
    lennarthennigs/Button2 @ 2.7.0
upload_protocol = nrfutil # blackmagic, cmsis-dap, jlink, nrfjprog, nrfutil, sam-ba
debug_tool = jlink
build_flags =
    ; ----------------- BLUEFRUIT LOGGING ---------------- ;
    -D CFG_DEBUG=0
    -g3 -ggdb
extra_scripts =
    pre:tools/generate_build_info.py
    post:tools/uf2conv.py
    tools/burn_bootloader.py
monitor_filters = 
    time
    send_on_enter

; Original linker script:
; c:\Users\<USER>\.platformio\packages\framework-arduinoadafruitnrf52-seeed\cores\nRF5\linker\nrf52840_s140_v7.ld
;
; Linker script which allocates more ram for the soft device.
; https://learn.adafruit.com/bluefruit-nrf52-feather-learning-guide/hathach-memory-map
board_build.ldscript = nrf52840_s140_v7_soft_device_more_ram.ld
